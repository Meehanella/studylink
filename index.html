<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWLink | Tutor. Learn. Succeed Together.</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --maroon: #600000;
            --dark-maroon: #4a0000;
            --yellow: #ffcc00;
            --cream: #fdfbf7;
        }
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--maroon), var(--dark-maroon));
            color: #ffffff; min-height: 100vh; overflow-x: hidden;
        }
        /* Moving Campus Background Effect */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 200%; height: 100%;
            background: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=2000&q=80') repeat-x;
            opacity: 0.12; z-index: -1; animation: slideBg 60s linear infinite;
        }
        @keyframes slideBg { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        header {
            background-color: var(--maroon); border-bottom: 4px solid var(--yellow);
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-title { font-size: 24px; font-weight: bold; color: var(--yellow); letter-spacing: 0.5px; }
        .logo-subtitle { font-size: 11px; color: #f0f0f0; text-transform: uppercase; }

        .hero {
            text-align: center; padding: 60px 20px; max-width: 900px; margin: 0 auto;
        }
        .hero h1 { font-size: 48px; color: var(--yellow); margin-bottom: 10px; }
        .hero p { font-size: 18px; color: #f0f0f0; margin-bottom: 30px; }

        /* Auth Card */
        .auth-card {
            max-width: 440px; margin: 20px auto 60px auto; background: #ffffff; color: #333;
            padding: 30px; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            border-top: 5px solid var(--yellow); text-align: left;
        }
        .auth-tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #eee; }
        .auth-tab {
            flex: 1; text-align: center; padding: 12px; font-weight: bold; cursor: pointer;
            color: #777; border-bottom: 3px solid transparent; transition: 0.3s;
        }
        .auth-tab.active { color: var(--maroon); border-bottom-color: var(--maroon); }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: var(--maroon); font-weight: 600; font-size: 14px; }
        input, select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc;
            box-sizing: border-box; background: #f9f9f9; font-size: 14px; color: #333;
        }
        input:focus { outline: none; border-color: var(--maroon); background: #fff; }
        
        .role-selector { display: flex; gap: 10px; margin-bottom: 18px; }
        .role-option {
            flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px;
            text-align: center; cursor: pointer; font-weight: 600; font-size: 13px; color: #555;
        }
        .role-option.selected { border-color: var(--maroon); background: rgba(96,0,0,0.05); color: var(--maroon); }

        .btn-primary {
            background-color: var(--maroon); color: white; font-weight: bold; width: 100%;
            padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s;
        }
        .btn-primary:hover { background-color: var(--dark-maroon); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <header>
        <div class="logo-container">
            <div>
                <div class="logo-title">PW<span style="color:#fff;">Link</span></div>
                <div class="logo-subtitle">Tutor. Learn. Succeed Together.</div>
            </div>
        </div>
    </header>

    <div class="hero">
        <h1>Learn Further with PWLink</h1>
        <p>Your trusted tutoring platform, built by PWC students, for PWC students.</p>

        <!-- AUTHENTICATION CARD -->
        <div class="auth-card">
            <div class="auth-tabs">
                <div id="tab-login-btn" class="auth-tab active" onclick="switchAuthMode('login')">Log In</div>
                <div id="tab-signup-btn" class="auth-tab" onclick="switchAuthMode('signup')">Sign Up</div>
            </div>

            <!-- Sign Up Extra Fields -->
            <div id="signup-fields" class="hidden">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Juan Dela Cruz">
                </div>
                <div class="form-group">
                    <label>I am a</label>
                    <div class="role-selector">
                        <div id="role-student" class="role-option selected" onclick="setRole('STUDENT')">Student</div>
                        <div id="role-tutor" class="role-option" onclick="setRole('TUTOR')">Tutor</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>PWC Email (@pwc.edu.ph)</label>
                <input type="email" id="email" placeholder="student@pwc.edu.ph">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn-primary" id="auth-submit-btn" onclick="handleAuthAction()">Log In</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qihryxvenaozhaqswzxy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpaHJ5eHZlbmFvemhhcXN3enh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTY2MTEsImV4cCI6MjEwNTczMjYxMX0.YgPQOuuB6X9L-JN0XYye6Iqs2VLQhHSDF1-hZwG0Zek';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignupMode = false;
        let selectedRole = 'STUDENT';

        function switchAuthMode(mode) {
            isSignupMode = (mode === 'signup');
            document.getElementById('tab-login-btn').classList.toggle('active', !isSignupMode);
            document.getElementById('tab-signup-btn').classList.toggle('active', isSignupMode);
            document.getElementById('signup-fields').classList.toggle('hidden', !isSignupMode);
            document.getElementById('auth-submit-btn').innerText = isSignupMode ? 'Create Account' : 'Log In';
        }

        function setRole(role) {
            selectedRole = role;
            document.getElementById('role-student').classList.toggle('selected', role === 'STUDENT');
            document.getElementById('role-tutor').classList.toggle('selected', role === 'TUTOR');
        }

        async function handleAuthAction() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email.endsWith('@pwc.edu.ph')) {
                alert('Please use a valid PWC email address (@pwc.edu.ph)[cite: 2].');
                return;
            }

            if (isSignupMode) {
                const name = document.getElementById('name').value.trim();
                if (!name) { alert('Please enter your full name.'); return; }

                const { error } = await supabaseClient.from('users').insert([{ name, email, password, role: selectedRole }]);
                if (error) alert('Sign Up Error: ' + error.message);
                else { alert('Account created successfully! You can now log in.'); switchAuthMode('login'); }
            } else {
                const { data, error } = await supabaseClient.from('users').select('*').eq('email', email).eq('password', password).single();
                if (error || !data) {
                    alert('Invalid email or password.');
                } else {
                    alert(`Welcome back, ${data.name}! Logging into your ${data.role} dashboard...`);
                    // We will transition into Part 2 dashboard next!
                }
            }
        }
    </script>
</body>
</html>
